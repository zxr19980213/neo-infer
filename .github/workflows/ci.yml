name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      neo4j:
        image: neo4j:5.26.31
        env:
          NEO4J_AUTH: neo4j/neo4jpass
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 64m
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Wait for Neo4j
        run: |
          for _ in $(seq 1 60); do
            if python -c 'from neo4j import GraphDatabase; d=GraphDatabase.driver("bolt://127.0.0.1:7687", auth=("neo4j","neo4jpass")); d.verify_connectivity(); d.close()'; then
              exit 0
            fi
            sleep 2
          done
          echo "Neo4j did not accept connections" >&2
          exit 1
      - run: pytest -q
        env:
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: neo4jpass
          NEO4J_DATABASE: neo4j
          NEO4J_IT: "1"
